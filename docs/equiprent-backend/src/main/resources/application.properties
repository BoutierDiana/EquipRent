# --- Base de datos ---------------------------------------------------------
# Los valores por defecto son los de la base local de desarrollo.
# En otro entorno se sobreescriben con variables: DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/equiprent}
spring.datasource.username=${DB_USERNAME:equiprent_admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate -------------------------------------------------------
# validate: Hibernate verifica que las entidades coincidan con el esquema; nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=equiprent
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway (ADR-002) ------------------------------------------------------
# Las migraciones viven en src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.schemas=equiprent
spring.flyway.default-schema=equiprent
spring.flyway.create-schemas=true
# Base que ya tenía V1 y V2 aplicados a mano en DataGrip: Flyway registra la línea base
# en la versión 2 y solo ejecuta V3 en adelante. En una base vacía ejecuta V1..V4.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# --- CORS ------------------------------------------------------------------
# Orígenes del frontend autorizados (separados por coma).
# Desarrollo: Vite dev (5173) y vite preview (4173). En producción: el dominio real.
equiprent.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# --- Swagger / OpenAPI -----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logs ------------------------------------------------------------------
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
