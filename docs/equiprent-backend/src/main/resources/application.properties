# --- Base de datos ---------------------------------------------------------
# Los valores por defecto son los de la base local de desarrollo.
# En otro entorno se sobreescriben con variables: DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/equiprent}
spring.datasource.username=${DB_USERNAME:equiprent_admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate -------------------------------------------------------
# validate: Hibernate verifica que las entidades coincidan con el esquema; nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=equiprent
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway (ADR-002) ------------------------------------------------------
# Las migraciones viven en src/main/resources/db/migration.
spring.flyway.enabled=true
spring.flyway.schemas=equiprent
spring.flyway.default-schema=equiprent
spring.flyway.create-schemas=true
# Base que ya tenía V1 y V2 aplicados a mano en DataGrip: Flyway registra la línea base
# en la versión 2 y solo ejecuta V3 en adelante. En una base vacía ejecuta V1..V4.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# --- CORS ------------------------------------------------------------------
# Orígenes del frontend autorizados (separados por coma).
# Desarrollo: Vite dev (5173) y vite preview (4173). En producción: el dominio real.
equiprent.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# --- Seguridad / JWT (Guía 11) --------------------------------------------
# required=false (por defecto): la API sigue pública para no romper el frontend web
# ni las Guías 08-10. Para practicar JWT, arrancar con EQUIPRENT_AUTH_REQUIRED=true.
# /api/health y /api/auth/login son siempre públicos.
equiprent.security.required=${EQUIPRENT_AUTH_REQUIRED:false}
# Usuario de DEMOSTRACIÓN de aula (NO usar en producción: ahí va un IAM o tabla de usuarios).
equiprent.demo.user=${EQUIPRENT_DEMO_USER:admin}
equiprent.demo.password=${EQUIPRENT_DEMO_PASSWORD:Equiprent2026!}
# Clave HMAC del JWT: mínimo 32 bytes. En otro entorno se reemplaza con la variable.
equiprent.jwt.secret=${EQUIPRENT_JWT_SECRET:equiprent-clave-de-aula-cambiar-en-produccion-32b}
equiprent.jwt.minutes=${EQUIPRENT_JWT_MINUTES:30}

# --- Fotos de evidencia (Guía 13) ----------------------------------------
# Carpeta local de AULA (no versionada). En producción: almacenamiento de objetos (S3, Blob).
equiprent.uploads.dir=${EQUIPRENT_UPLOADS_DIR:archivos-dev}
# Límite de Spring algo mayor que el del servicio (4 MB) para que éste devuelva un 400 claro.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Swagger / OpenAPI -----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logs ------------------------------------------------------------------
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
