spring:
  application:
    name: equiprent-backend
  datasource:
    # Las credenciales se leen de variables de entorno.
    # Los valores por defecto son SOLO para el laboratorio local.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/equiprent}
    username: ${DB_USERNAME:equiprent_admin}
    password: ${DB_PASSWORD:Cambia_Esta_Clave_2026!}
  jpa:
    hibernate:
      ddl-auto: validate          # Java se adapta al DDL; NUNCA create/update
    properties:
      hibernate:
        default_schema: equiprent
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
